name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dataset:
    name: Dataset & app checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate the dataset
        run: python3 scripts/validate.py --verbose

      - name: Check IT/EN dictionaries
        run: node scripts/check-i18n.mjs

      - name: Syntax-check the server
        run: node --check server/server.mjs

      - name: End-to-end smoke test (boots the server, exercises API + assets)
        run: bash scripts/smoke.sh
